- id: swift-concurrency
  questions:
    - "Как работает async/await в Swift?"
    - "Explain how Swift concurrency works"
    - "Як працює async/await у Swift?"
    - "Расскажите про акторы и Task в Swift"
    - "What are actors and tasks in Swift?"
    - "Розкажіть про актори та Task у Swift"
  answer: |
    • async-функции приостанавливаются на await, поток не блокируется
    • Структурная конкурентность: Task, TaskGroup, отмена по дереву
    • Actor защищает состояние; MainActor — для UI
    • Sendable проверяет безопасную передачу данных между задачами

- id: memory-management
  questions:
    - "Как работает управление памятью в iOS?"
    - "How does ARC work and how do you avoid retain cycles?"
    - "Як працює керування пам'яттю в iOS?"
    - "Что такое retain cycle и как его избежать?"
    - "What is a retain cycle?"
    - "Що таке retain cycle і як його уникнути?"
  answer: |
    • ARC считает сильные ссылки, объект освобождается при нуле
    • Циклы: weak/unowned в замыканиях и делегатах
    • Ищу утечки через Memory Graph и Instruments

- id: architecture
  questions:
    - "Какую архитектуру вы используете в iOS-приложениях?"
    - "Which architecture do you prefer for iOS apps?"
    - "Яку архітектуру ви використовуєте в iOS-застосунках?"
    - "Расскажите про MVVM и другие архитектуры"
    - "Tell me about MVVM and other patterns"
    - "Розкажіть про MVVM та інші архітектури"
  answer: |
    • MVVM + координаторы, модули на SPM
    • Зависимости через протоколы и DI-контейнер
    • Выбор под команду: важнее единообразие, чем модный паттерн

- id: testing
  questions:
    - "Как вы тестируете код?"
    - "How do you approach testing?"
    - "Як ви тестуєте код?"
    - "Какие тесты вы пишете?"
    - "What kinds of tests do you write?"
    - "Які тести ви пишете?"
  answer: |
    • Юнит-тесты на бизнес-логику и view model, ~70% покрытия модулей
    • Снапшот-тесты для ключевых экранов
    • UI-тесты только на критические сценарии: вход, платёж

