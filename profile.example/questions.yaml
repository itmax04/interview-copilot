# База вопросов (R-06), пример. Вымышленный кандидат, все данные синтетические.
- id: about-me
  questions:
    - "Расскажите о себе"
    - "Tell me about yourself"
    - "Розкажіть про себе"
    - "Расскажите о своём опыте работы"
    - "Walk me through your background"
    - "Розкажіть про свій професійний шлях"
  answer: |
    • 7 лет в iOS, 3 года тимлидом команды из 4 человек
    • Последний проект — мобильный банк на 1,2 млн пользователей, рейтинг 4,8
    • Перевёл 70% экранов на SwiftUI без остановки релизов
    • Ищу продукт, где важны качество и скорость

- id: why-leaving
  questions:
    - "Почему вы уходите с текущей работы?"
    - "Why are you leaving your current job?"
    - "Чому ви йдете з поточної роботи?"
    - "Почему вы ищете новую работу?"
    - "Why are you looking for a new job?"
    - "Чому ви вирішили змінити роботу?"
  answer: |
    • Проект вышел на стабильную стадию, хочу новых продуктовых задач
    • Ищу команду с сильной инженерной культурой и менторством
    • Ухожу «к», а не «от»: с командой хорошие отношения

- id: why-us
  questions:
    - "Почему вы хотите работать у нас?"
    - "Why do you want to work at our company?"
    - "Чому ви хочете працювати в нашій компанії?"
    - "Чем вас заинтересовала наша вакансия?"
    - "What attracts you to our company?"
    - "Чим вас приваблює наша вакансія?"
  answer: |
    • Продукт для путешествий — пользуюсь сам, вижу, что улучшить
    • Ваш стек совпадает с моим: SwiftUI, Concurrency, модули
    • Нравится, что инженеры участвуют в продуктовых решениях

- id: strengths
  questions:
    - "Какие у вас сильные стороны?"
    - "What are your strengths?"
    - "Які ваші сильні сторони?"
    - "Что вы делаете лучше всего?"
    - "What are you best at?"
    - "У чому ви найсильніші?"
  answer: |
    • Довожу сложные миграции до конца без остановки релизов
    • Умею объяснять и учить: двое менти выросли до senior
    • Думаю о метриках: падения, старт, скорость сборки

- id: weaknesses
  questions:
    - "Какие у вас слабые стороны?"
    - "What is your biggest weakness?"
    - "Які ваші слабкі сторони?"
    - "Что вам стоит улучшить в себе?"
    - "What do you need to work on?"
    - "Що вам варто покращити?"
  answer: |
    • Раньше брал слишком много на себя как лид
    • Сейчас делегирую через явные зоны ответственности и еженедельные 1:1
    • Результат: команда меньше зависит от меня

- id: conflict
  questions:
    - "Расскажите о конфликте в команде"
    - "Tell me about a conflict with a colleague"
    - "Розкажіть про конфлікт у команді"
    - "Как вы решаете разногласия с коллегами?"
    - "How do you handle disagreements with coworkers?"
    - "Як ви вирішуєте розбіжності з колегами?"
  tags: [STAR]
  answer: |
    **S** — двое разработчиков спорили о навигации, ревью шли неделю
    **T** — разблокировать команду и сохранить отношения
    **A** — спайк с двумя прототипами, общие критерии, решение по данным
    **R** — ревью снова за день, подход работает до сих пор

- id: failure
  questions:
    - "Расскажите о своей ошибке или неудаче"
    - "Tell me about a time you failed"
    - "Розкажіть про свою помилку"
    - "Расскажите о проекте, который пошёл не по плану"
    - "Describe a project that went wrong"
    - "Розкажіть про проєкт, який пішов не за планом"
  tags: [STAR]
  answer: |
    **S** — релиз новой авторизации сломал вход у 3% на старых iOS
    **T** — быстро вернуть вход и не повторить
    **A** — откат фича-флагом за 20 минут, тесты на старые версии, чек-лист релиза
    **R** — повторов не было

- id: hardest-project
  questions:
    - "Какой самый сложный проект у вас был?"
    - "What is the most challenging project you worked on?"
    - "Який найскладніший проєкт у вас був?"
    - "Расскажите о самой сложной задаче, которую вы решили"
    - "Tell me about the hardest problem you solved"
    - "Розкажіть про найскладнішу задачу, яку ви вирішили"
  tags: [STAR]
  answer: |
    **S** — миграция банка с UIKit на SwiftUI без остановки релизов
    **T** — основные экраны за 9 месяцев
    **A** — модули, мост UIKit↔SwiftUI, по экрану в спринт
    **R** — 70% экранов на SwiftUI, падения −80%

- id: deadline
  questions:
